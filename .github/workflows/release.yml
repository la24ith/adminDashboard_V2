name: Release APK

# يُشغَّل عند رفع tag يبدأ بـ v (مثل v1.0.1): يبني APK بنسخة release
# وينشئ صفحة Release على GitHub ويرفق الـ APK بها.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk admin-dashboard-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-apk
          path: admin-dashboard-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: admin-dashboard-*.apk
          body_path: .github/release_notes.md
          # tag فيه شرطة (مثل v1.0.1-beta.1) يُنشر كـ pre-release تجريبي
          prerelease: ${{ contains(github.ref_name, '-') }}
